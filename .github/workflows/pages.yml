name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel for the WASM playground
        run: |
          uv build --wheel
          WHEEL=$(basename dist/kairos_scheduler-*.whl)
          cp "dist/$WHEEL" site/playground/
          echo "$WHEEL" > site/playground/wheel.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
