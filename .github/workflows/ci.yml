name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Test suite (incl. real SQLite e2e lifecycle)
        run: uv run pytest tests -q

  quickstart:
    # Executes the README quickstart verbatim against the built wheel:
    # boot with SQLite + demo auth, then exercise the live HTTP surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - name: Boot via uvx and probe
        run: |
          KAIROS_API_KEY=ci uvx --from dist/kairos_scheduler-*.whl kairos --port 8003 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8003/health && break; sleep 1; done
          set -ex
          curl -sf http://127.0.0.1:8003/health | grep '"ok"'
          curl -sf http://127.0.0.1:8003/ | grep -i kairos            # dashboard (demo auth)
          curl -sf http://127.0.0.1:8003/llms.txt | grep openapi      # agent discovery
          curl -sf http://127.0.0.1:8003/api/openapi.json | grep bearerAuth
          # API lifecycle: create -> respond -> decide -> ics
          POLL=$(curl -sf -X POST http://127.0.0.1:8003/api/polls \
            -H 'Authorization: Bearer ci' -H 'Content-Type: application/json' \
            -d '{"title":"CI poll","mode":"full_day","slots":[{"date":"2026-12-01"}]}')
          ID=$(echo "$POLL" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          SLOT=$(echo "$POLL" | python3 -c 'import json,sys;print(json.load(sys.stdin)["slots"][0]["id"])')
          curl -sf -X POST "http://127.0.0.1:8003/api/polls/$ID/respond" \
            -H 'Authorization: Bearer ci' -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI\",\"availabilities\":{\"$SLOT\":\"yes\"}}" | grep CI
          curl -sf -X POST "http://127.0.0.1:8003/api/polls/$ID/decide" \
            -H 'Authorization: Bearer ci' -H 'Content-Type: application/json' \
            -d "{\"slot_id\":\"$SLOT\"}" | grep decided
          curl -sf "http://127.0.0.1:8003/api/polls/$ID/event.ics" \
            -H 'Authorization: Bearer ci' | grep "BEGIN:VCALENDAR"
          kill %1 && wait || true   # free uv for the cache post-step

  mysql:
    # The "or MySQL/MariaDB" claim: same lifecycle against a real MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: ci, MARIADB_DATABASE: kairos }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect" --health-interval=5s
          --health-timeout=3s --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Boot against MariaDB and probe
        run: |
          uv build --wheel
          KAIROS_DB_URL=mysql://root:ci@127.0.0.1:3306/kairos KAIROS_API_KEY=ci \
            uvx --from "$(ls dist/kairos_scheduler-*.whl)[mysql]" kairos --port 8003 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8003/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8003/health | grep '"ok"'
          curl -sf -X POST http://127.0.0.1:8003/api/polls \
            -H 'Authorization: Bearer ci' -H 'Content-Type: application/json' \
            -d '{"title":"MariaDB poll","mode":"full_day","slots":[{"date":"2026-12-01"}]}' | grep share_url
          kill %1 && wait || true   # free uv for the cache post-step

  image:
    # Obligation D3 (#35): the OCI image wraps the same uvicorn app, so prove it
    # by booting it and exercising the same lifecycle the `quickstart` job runs.
    # Podman is preinstalled on the hosted runners; `docker compose` validates
    # the compose files (the v2 plugin ships with the runner's docker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: podman build -t kairos:ci .
      - name: Boot non-root, probe /health, run a poll lifecycle
        run: |
          podman run -d --name kairos -p 127.0.0.1:8003:8003 \
            -e KAIROS_API_KEY=ci -v kairos-ci-data:/data kairos:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8003/health && break; sleep 1; done
          set -ex
          curl -sf http://127.0.0.1:8003/health | grep '"ok"'
          # uid must not be 0 — the image ships a kairos user.
          podman exec kairos id -u | grep -vx 0
          # the SQLite file must be on the mounted volume, owned by that user
          podman exec kairos ls -l /data/kairos.db
          POLL=$(curl -sf -X POST http://127.0.0.1:8003/api/polls \
            -H 'Authorization: Bearer ci' -H 'Content-Type: application/json' \
            -d '{"title":"Image poll","mode":"full_day","slots":[{"date":"2026-12-01"}]}')
          ID=$(echo "$POLL" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          SLOT=$(echo "$POLL" | python3 -c 'import json,sys;print(json.load(sys.stdin)["slots"][0]["id"])')
          curl -sf -X POST "http://127.0.0.1:8003/api/polls/$ID/respond" \
            -H 'Authorization: Bearer ci' -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI\",\"availabilities\":{\"$SLOT\":\"yes\"}}" | grep CI
          curl -sf -X POST "http://127.0.0.1:8003/api/polls/$ID/decide" \
            -H 'Authorization: Bearer ci' -H 'Content-Type: application/json' \
            -d "{\"slot_id\":\"$SLOT\"}" | grep decided
          curl -sf "http://127.0.0.1:8003/api/polls/$ID/event.ics" \
            -H 'Authorization: Bearer ci' | grep "BEGIN:VCALENDAR"
      - name: The database survives a container rebuild
        run: |
          set -ex
          POLL_ID=$(podman exec kairos python -c "
          import sqlite3; c = sqlite3.connect('/data/kairos.db')
          print(c.execute('SELECT id FROM sched_polls ORDER BY created_at DESC LIMIT 1').fetchone()[0])")
          podman rm -f kairos                       # destroy the container...
          podman run -d --name kairos -p 127.0.0.1:8003:8003 \
            -e KAIROS_API_KEY=ci -v kairos-ci-data:/data kairos:ci  # ...keep the volume
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8003/health && break; sleep 1; done
          # An ephemeral filesystem would 404 this: the poll is only in the volume.
          curl -sf "http://127.0.0.1:8003/api/polls/$POLL_ID" -H 'Authorization: Bearer ci' | grep decided
      - name: A forged X-Forwarded-For cannot defeat the trusted-proxy allowlist
        # The security property the image's CMD exists to preserve: uvicorn's
        # default proxy_headers=True would rewrite the peer from XFF *before*
        # Kairos sees it, so this would return 200 instead of 403.
        run: |
          set -ex
          podman rm -f kairos-s1
          podman run -d --name kairos-s1 -e KAIROS_AUTH=header \
            -e SESSION_SECRET=ci -e KAIROS_TRUSTED_PROXY_CIDRS=192.0.2.0/24 kairos:ci
          sleep 5
          # /health is exempt from the allowlist, so probes still work
          podman exec kairos-s1 python -c "
          import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8003/health').status == 200"
          # everything else is refused, including with a forged XFF inside the
          # allowlist and an asserted identity
          test "$(podman exec kairos-s1 python -c "
          import urllib.request, urllib.error
          r = urllib.request.Request('http://127.0.0.1:8003/api/polls', method='POST',
            data=b'{\"title\":\"evil\",\"mode\":\"full_day\",\"slots\":[{\"date\":\"2026-12-01\"}]}',
            headers={'Content-Type': 'application/json', 'X-Forwarded-For': '192.0.2.7',
                     'X-User': 'attacker'})
          try:
              urllib.request.urlopen(r); print('REACHED')
          except urllib.error.HTTPError as e:
              print(e.code)")" = "403"
      - name: Compose files are valid
        run: |
          docker compose -f compose.yaml config -q
          KAIROS_DB_PASSWORD=ci KAIROS_DB_ROOT_PASSWORD=ci \
            docker compose -f compose.yaml -f compose.mysql.yaml config -q
          KAIROS_SITE=x ACME_EMAIL=a@b.c OIDC_ISSUER_URL=https://id.example.org \
            OIDC_CLIENT_ID=c OIDC_CLIENT_SECRET=s OIDC_REDIRECT_URL=https://x/cb \
            OIDC_ALLOWED_DOMAINS=e.org OAUTH2_PROXY_COOKIE_SECRET=k SESSION_SECRET=s \
            docker compose -f compose.proxy.yaml config -q
          # A missing operator secret must fail the deploy, not boot with a blank one.
          # (No .env in a fresh checkout, so this is the unset case.)
          ! docker compose -f compose.proxy.yaml config -q

  licenses:
    # No copyleft surprises in the dependency tree (we ship MIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Audit dependency licenses
        run: |
          uv sync --all-extras -q
          uv run --with pip-licenses pip-licenses \
            --partial-match \
            --allow-only="MIT;BSD;Apache;Apache Software License;Apache-2.0;ISC;Python Software Foundation;PSF;MPL;Mozilla Public License 2.0;Unlicense;CC0;Public Domain;Zero-Clause" \
            --ignore-packages kairos-scheduler pip-licenses prettytable wcwidth

  audit:
    # Known-CVE scan of the lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv export --all-extras --no-emit-project -o req.txt -q && uvx pip-audit -r req.txt --disable-pip

  gates:
    # ADR obligations run on PRs, not just at pre-commit (guardrails convention:
    # CI invokes the SAME check definitions — no "passes locally / fails in CI").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: ADR gates (adr-matrix + ADR-0004/0007) via the pre-commit definitions
        run: |
          nix develop -c bash -euo pipefail -c '
            for g in adr-matrix adr-0004-stdlib-ics adr-0007-no-3p-shortener; do
              echo "== $g =="; prek run "$g" --all-files
            done'
      - name: Secret scan (S4 — full history)
        run: nix develop -c gitleaks detect --redact --config .gitleaks.toml
